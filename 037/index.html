<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Passkey Go Test</title>
  </head>
  <body>
    <h2>Passkey Authentication Test</h2>
    <input
      type="text"
      id="username"
      placeholder="Enter username"
      value="alice"
    />
    <br /><br />
    <button onclick="register()">Register Passkey</button>
    <button onclick="login()">Login with Passkey</button>

    <pre id="log"></pre>

    <script>
      const log = (msg) =>
        (document.getElementById("log").innerText += msg + "\n");

      // --- Helper functions for Base64URL encoding/decoding ---
      function bufferToBase64URL(buffer) {
        const bytes = new Uint8Array(buffer);
        let string = "";
        for (let i = 0; i < bytes.byteLength; i++) {
          string += String.fromCharCode(bytes[i]);
        }
        return btoa(string)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      function base64URLToBuffer(base64URL) {
        if (typeof base64URL !== "string") return new Uint8Array();
        let base64 = base64URL.replace(/-/g, "+").replace(/_/g, "/");
        while (base64.length % 4) {
          base64 += "=";
        }
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }

      // --- Registration Flow ---
      async function register() {
        const username = document.getElementById("username").value;
        try {
          log(`1. Requesting registration options for ${username}...`);
          const beginRes = await fetch(`/register/begin?username=${username}`);
          const options = await beginRes.json();

          // Convert base64url strings into ArrayBuffers expected by browser API
          options.publicKey.challenge = base64URLToBuffer(
            options.publicKey.challenge,
          );
          options.publicKey.user.id = base64URLToBuffer(
            options.publicKey.user.id,
          );

          if (options.publicKey.excludeCredentials) {
            options.publicKey.excludeCredentials.forEach((cred) => {
              cred.id = base64URLToBuffer(cred.id);
            });
          }

          log("2. Opening Passkey prompt...");
          const credential = await navigator.credentials.create({
            publicKey: options.publicKey,
          });

          log("3. Sending credential to server...");
          // Convert ArrayBuffers back to Base64URL strings for Go server
          const credentialJSON = {
            id: credential.id,
            rawId: bufferToBase64URL(credential.rawId),
            type: credential.type,
            response: {
              clientDataJSON: bufferToBase64URL(
                credential.response.clientDataJSON,
              ),
              attestationObject: bufferToBase64URL(
                credential.response.attestationObject,
              ),
            },
          };

          const finishRes = await fetch(
            `/register/finish?username=${username}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(credentialJSON),
            },
          );
          const result = await finishRes.json();
          log("Result: " + JSON.stringify(result));
        } catch (err) {
          log("Error: " + err.message);
        }
      }

      // --- Login Flow ---
      async function login() {
        const username = document.getElementById("username").value;
        try {
          log(`1. Requesting login options for ${username}...`);
          const beginRes = await fetch(`/login/begin?username=${username}`);
          const options = await beginRes.json();

          // Convert base64url strings into ArrayBuffers
          options.publicKey.challenge = base64URLToBuffer(
            options.publicKey.challenge,
          );

          if (options.publicKey.allowCredentials) {
            options.publicKey.allowCredentials.forEach((cred) => {
              cred.id = base64URLToBuffer(cred.id);
            });
          }

          log("2. Opening Passkey prompt...");
          const credential = await navigator.credentials.get({
            publicKey: options.publicKey,
          });

          log("3. Verifying credential with server...");
          // Convert ArrayBuffers back to Base64URL strings
          const credentialJSON = {
            id: credential.id,
            rawId: bufferToBase64URL(credential.rawId),
            type: credential.type,
            response: {
              clientDataJSON: bufferToBase64URL(
                credential.response.clientDataJSON,
              ),
              authenticatorData: bufferToBase64URL(
                credential.response.authenticatorData,
              ),
              signature: bufferToBase64URL(credential.response.signature),
              userHandle: credential.response.userHandle
                ? bufferToBase64URL(credential.response.userHandle)
                : null,
            },
          };

          const finishRes = await fetch(`/login/finish?username=${username}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(credentialJSON),
          });
          const result = await finishRes.json();
          log("Result: " + JSON.stringify(result));
        } catch (err) {
          log("Error: " + err.message);
        }
      }
    </script>
  </body>
</html>
